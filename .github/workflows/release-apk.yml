name: Release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag name (e.g. v1.0.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Run unit and Robolectric tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Determine release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
            if [ -z "$TAG" ]; then
              TAG="v1.0.${{ github.run_number }}"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build signed Release APK (when keystore secrets are configured)
        id: build_apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p release-apks
          TAG="${{ steps.meta.outputs.tag }}"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/upload-keystore.jks"
            export KEYSTORE_PATH="${{ runner.temp }}/upload-keystore.jks"
            gradle :app:assembleRelease --no-daemon
            APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            cp "$APK_SRC" "release-apks/NetPulse-WiFi-${TAG}-release.apk"
            echo "apk_path=release-apks/NetPulse-WiFi-${TAG}-release.apk" >> "$GITHUB_OUTPUT"
            echo "build_type=Release (Signed)" >> "$GITHUB_OUTPUT"
          else
            gradle :app:assembleDebug --no-daemon
            APK_SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
            cp "$APK_SRC" "release-apks/NetPulse-WiFi-${TAG}-debug.apk"
            echo "apk_path=release-apks/NetPulse-WiFi-${TAG}-debug.apk" >> "$GITHUB_OUTPUT"
            echo "build_type=Debug (Add KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD secrets for signed release)" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetPulse-WiFi-APK-${{ steps.meta.outputs.tag }}
          path: ${{ steps.build_apk.outputs.apk_path }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "NetPulse Wi-Fi ${{ steps.meta.outputs.tag }}"
          body: |
            Automated APK build from GitHub Actions.
            - **Build Type:** ${{ steps.build_apk.outputs.build_type }}
            - **Min SDK:** 24 (Android 7.0+)
            - **Target SDK:** 36
          files: ${{ steps.build_apk.outputs.apk_path }}
          generate_release_notes: true
